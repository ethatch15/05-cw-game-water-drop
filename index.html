<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Drop Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-wrapper">
        <img class="logo" src="img/cw_logo-horizontal.png" alt="charity: water logo">
        <h1 class="game-title">Water Drop</h1>
        <p class="game-tagline">Catch the clean drops, dodge the dirty ones!</p>

        <div class="score-panel">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="lives">Lives: <span id="lives">❤️❤️❤️</span></div>
            <div class="timer">Time: <span id="time">30</span>s</div>
            <button id="start-btn">Start Game</button>
        </div>

        <div id="game-container">
            <!-- The player's water can. Move it with the mouse, finger, or arrow keys. -->
            <img id="catcher" src="img/water-can-transparent.png" alt="Water can">

            <!-- Shown before the game starts and after it ends -->
            <div id="message" class="message">
                <h2 id="message-title">How to play</h2>
                <p id="message-text">
                    Move the water can to catch drops.<br>
                    💧 Clean drop caught: <strong>+4 points</strong><br>
                    💧 Clean drop missed: <strong>−1 point</strong><br>
                    🟤 Dirty drop caught: <strong>lose a life</strong><br>
                    You have 3 lives and 30 seconds. Score 40+ to win!
                </p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
